<?xml version="1.0" encoding="UTF-8"?>
<!-- FunRun app icon (source of the PNGs in res/mipmap-* and res/drawable-*). Canvas = Android adaptive icon (108 x 108),
     background and foreground layers; legacy icons show the central 72 x 72. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
<g id="background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="0.55" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ec5f0c"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#bg)"/></g>
<g id="foreground">
  <!-- mountain with two summits -->
  <path d="M18 71 L38.5 45 L45.5 52 L60 29 L90 71 Z" fill="#b34708"/>
  <path d="M60 29 L54.2 37.8 L57.4 36.4 L60.2 39 L63.2 36.2 L66 38 Z" fill="#fff3e8"/>
  <!-- hairpin road up the mountain face, thinner further up -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 65.4 L58 55.8 Q63.4 54.9 58.4 53.2 L46.6 50" stroke-width="3"/>
    <path d="M46.6 50 Q42 48.6 46.8 47.4 L60 44.6 Q64 43.7 60 42.4 L52.4 40.6" stroke-width="2.5"/>
    <path d="M52.4 40.6 Q49.4 39.8 52.6 39 L57.4 38" stroke-width="2"/>
  </g>
  <!-- road bike -->
  <g fill="none" stroke="#1d130d" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="40" cy="75.4" r="8.8" stroke-width="3"/>
    <circle cx="68" cy="75.4" r="8.8" stroke-width="3"/>
    <!-- rear triangle, seat tube, top tube, down tube, fork -->
    <path d="M40 75.4 L52.6 76 L48.8 64.4 Z" stroke-width="2.8"/>
    <path d="M48.8 64.4 L63.8 62.9 L65.1 66.4 L52.6 76" stroke-width="2.8"/>
    <path d="M65.1 66.4 Q66.6 70.6 68 75.4" stroke-width="2.6"/>
    <!-- seat post and saddle -->
    <path d="M48.8 64.4 L48.1 61.8" stroke-width="2.4"/>
    <path d="M45 61.4 L51.4 61.2" stroke-width="2.8"/>
    <!-- stem and drop handlebar -->
    <path d="M63.6 62.6 L66.6 61.8 Q69.8 61.6 69.6 64.6 Q69.4 66.6 67.2 66.8" stroke-width="2.4"/>
  </g></g>
</svg>
