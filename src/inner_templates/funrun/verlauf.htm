<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>QuestRun – Meine Fahrten</title>
<!-- Ride history: totals per week, month or year, the last rides and the best times per route -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap">
<link rel="stylesheet" href="funrun.css">
<style>
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.seg button { appearance: none; -webkit-appearance: none; border: 0; height: 38px; border-radius: 9px; font-size: 15px; font-weight: 700; cursor: pointer; background: transparent; color: var(--soft); }
.seg button.on { background: var(--accent); color: var(--accent-dark); }
.period { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.period .nav { appearance: none; -webkit-appearance: none; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--soft); cursor: pointer; font-size: 18px; }
.period .nav:disabled { opacity: .3; cursor: default; }
.ptitle { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ptitle b { font-size: 20px; }
.sums { margin: 12px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.sums dt { font-size: 12px; font-weight: 600; color: var(--muted); }
.sums dd { margin: 0; font-size: 28px; line-height: 1.1; }
.sums dd small { font-family: Barlow, Roboto, Arial, sans-serif; font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 4px; }
@media (min-width: 520px) { .sums { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 96px; border-bottom: 1px solid var(--line2); margin-top: 8px; }
.bars button { appearance: none; -webkit-appearance: none; border: 0; padding: 0; background: transparent; flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end; cursor: pointer; }
.bars span { display: block; width: 100%; border-radius: 4px 4px 0 0; }
.blabels { display: flex; gap: 6px; margin-top: 6px; }
.blabels span { flex: 1; min-width: 0; text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); }
.blabels span.on { color: var(--text); }
.ride { appearance: none; -webkit-appearance: none; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 8px 16px; cursor: pointer; color: var(--text); }
.ride .ic { width: 40px; height: 40px; flex: none; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--accent); }
.ride .ic svg { width: 24px; height: 24px; }
.ride .l { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ride .n { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ride .m { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ride .r { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.ride .t { font-size: 21px; line-height: 1; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-dark); }
.more { appearance: none; -webkit-appearance: none; width: 100%; background: transparent; border: 0; border-top: 1px solid var(--line); height: 48px; color: var(--accent); font-size: 15px; font-weight: 600; cursor: pointer; }
.best { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 16px; border-top: 1px solid var(--line); }
.best svg { width: 22px; height: 26px; flex: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div style="min-width:0">
      <div class="eyebrow">QuestRun</div>
      <h1>Meine Fahrten</h1>
    </div>
  </div>

  <div class="msg" id="msg">Fahrten werden geladen …</div>

  <div class="cols hidden" id="content">
    <div class="col">
      <div class="seg" role="group" aria-label="Zeitraum" id="ranges">
        <button data-r="week" class="on">Woche</button><button data-r="month">Monat</button><button data-r="year">Jahr</button>
      </div>
      <section class="card">
        <div class="period">
          <button class="nav" id="prev" aria-label="Früher">‹</button>
          <div class="ptitle"><b id="pTitle"></b><span class="muted" id="pSub"></span></div>
          <span class="chip" style="background:var(--bg);border:1px solid var(--line);color:var(--soft)" id="pCount"></span>
          <button class="nav" id="next" aria-label="Später">›</button>
        </div>
        <dl class="sums" id="sums"></dl>
        <div class="hidden" id="goalBox" style="margin-top:12px;display:flex;flex-direction:column;gap:6px">
          <div class="chead"><span class="muted" style="font-size:13px;font-weight:600">Monatsziel</span><span style="font-size:14px;font-weight:600" id="goalVal"></span></div>
          <div class="bar" role="img" id="goalBarBox"><i id="goalBar"></i></div>
        </div>
        <div style="height:1px;background:var(--line);margin:14px 0 10px"></div>
        <div class="chead"><span class="muted" style="font-size:13px;font-weight:600" id="barTitle"></span><span style="font-size:14px;font-weight:600" id="barSel"></span></div>
        <div class="bars" id="bars"></div>
        <div class="blabels" id="blabels"></div>
      </section>
    </div>
    <div class="col">
      <section class="card flat">
        <div class="chead" style="padding:14px 16px 10px"><h2>Letzte Fahrten</h2><span class="aside" id="rideCount"></span></div>
        <div id="rides"></div>
        <button class="more hidden" id="more">Mehr Fahrten anzeigen</button>
      </section>
      <section class="card flat hidden" id="bestCard">
        <div class="chead" style="padding:14px 16px 10px"><h2>Bestzeiten</h2><span class="aside">fahren als Geist mit</span></div>
        <div id="bests"></div>
      </section>
    </div>
  </div>
</div>
<script src="funrun.js"></script>
<script>
(function () {
'use strict';
const $ = FR.$;
FR.tabs('verlauf.htm');

const ROUTE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7.5a3.5 3.5 0 0 0 0-7h-7a3.5 3.5 0 0 1 0-7H16"/></svg>';
const BIKE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M5.5 16.5 9 9h6.5l3 7.5M9 9l3.5 7.5M14 5.5h2.5l-1 3.5"/></svg>';
const GHOST_ICON = '<svg viewBox="0 0 34 42" aria-hidden="true"><path d="M4 40V17a13 13 0 0 1 26 0v23l-4.3-3.2-4.4 3.2-4.3-3.2-4.3 3.2-4.4-3.2z" fill="none" stroke="#6fd3ff" stroke-width="2.6" stroke-linejoin="round"/><circle cx="12.5" cy="17" r="2.3" fill="#6fd3ff"/><circle cx="21.5" cy="17" r="2.3" fill="#6fd3ff"/></svg>';

let rides = [], goal = 0;
let range = 'week', offset = 0, sel = -1, shown = 12;
// best ride per route (route key -> ride) and their ids, for the badge in the list
const bestByRoute = new Map(), bestIds = new Set();

// ------------------------------------------------------------------ periods
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const monday = d => { const x = startOfDay(d), wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return x; };
// ISO week number
function isoWeek(d) {
  const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = x.getUTCDay() || 7;
  x.setUTCDate(x.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
  return Math.ceil(((x - y0) / 86400000 + 1) / 7);
}
// the period shown: [from, to), buckets for the bars, titles
function period() {
  const now = new Date();
  if (range === 'week') {
    const from = monday(now); from.setDate(from.getDate() + 7 * offset);
    const to = new Date(from); to.setDate(to.getDate() + 7);
    const last = new Date(to); last.setDate(last.getDate() - 1);
    const buckets = [];
    for (let i = 0; i < 7; i++) { const a = new Date(from); a.setDate(a.getDate() + i); const b = new Date(a); b.setDate(b.getDate() + 1); buckets.push({ a, b, label: FR.daysShort[a.getDay()], full: FR.daysShort[a.getDay()] + ', ' + a.getDate() + '.' + (a.getMonth() + 1) + '.' }); }
    return { from, to, buckets, title: offset === 0 ? 'Diese Woche' : offset === -1 ? 'Letzte Woche' : 'KW ' + isoWeek(from) + ' ' + from.getFullYear(),
      sub: from.getDate() + '.' + (from.getMonth() + 1) + '. – ' + last.getDate() + '.' + (last.getMonth() + 1) + '.' + last.getFullYear(), barTitle: 'Kilometer pro Tag' };
  }
  if (range === 'month') {
    const from = new Date(now.getFullYear(), now.getMonth() + offset, 1), to = new Date(from.getFullYear(), from.getMonth() + 1, 1);
    const buckets = [];
    let a = monday(from);
    while (a < to) { const b = new Date(a); b.setDate(b.getDate() + 7); buckets.push({ a: a < from ? from : a, b: b > to ? to : b, label: 'KW ' + isoWeek(a), full: 'KW ' + isoWeek(a) }); a = b; }
    return { from, to, buckets, title: FR.months[from.getMonth()] + (from.getFullYear() !== now.getFullYear() ? ' ' + from.getFullYear() : ''),
      sub: offset === 0 ? 'dieser Monat' : FR.months[from.getMonth()] + ' ' + from.getFullYear(), barTitle: 'Kilometer pro Woche' };
  }
  const from = new Date(now.getFullYear() + offset, 0, 1), to = new Date(from.getFullYear() + 1, 0, 1);
  const buckets = [];
  for (let m = 0; m < 12; m++) buckets.push({ a: new Date(from.getFullYear(), m, 1), b: new Date(from.getFullYear(), m + 1, 1), label: FR.months[m].charAt(0), full: FR.months[m] });
  return { from, to, buckets, title: String(from.getFullYear()), sub: offset === 0 ? 'dieses Jahr' : 'Jahr ' + from.getFullYear(), barTitle: 'Kilometer pro Monat' };
}

function renderPeriod() {
  const P = period(), now = new Date();
  const inP = rides.filter(r => { const d = FR.date(r.start); return d >= P.from && d < P.to; });
  let dist = 0, time = 0, up = 0, kcal = 0;
  for (const r of inP) { dist += r.distance || 0; time += r.duration || 0; up += r.ascent || 0; kcal += r.kcal || 0; }
  $('pTitle').textContent = P.title;
  $('pSub').textContent = P.sub;
  $('pCount').textContent = inP.length === 1 ? '1 Fahrt' : inP.length + ' Fahrten';
  const h = Math.floor(time / 3600), m = Math.floor(time / 60) % 60;
  $('sums').innerHTML =
    '<div><dt>Strecke</dt><dd class="cond">' + FR.num(dist / 1000, dist < 100000 ? 1 : 0) + '<small>km</small></dd></div>' +
    '<div><dt>Fahrzeit</dt><dd class="cond">' + h + ':' + String(m).padStart(2, '0') + '<small>h</small></dd></div>' +
    '<div><dt>Höhenmeter</dt><dd class="cond">' + FR.num(up) + '<small>m</small></dd></div>' +
    '<div><dt>Kalorien</dt><dd class="cond">' + FR.num(kcal) + '<small>kcal</small></dd></div>';
  $('next').disabled = offset >= 0;
  // goal of the month (the same goal for every month)
  const showGoal = range === 'month' && goal > 0;
  $('goalBox').classList.toggle('hidden', !showGoal);
  if (showGoal) {
    const km = dist / 1000, pct = Math.min(100, km / goal * 100);
    $('goalVal').textContent = km >= goal ? 'geschafft · ' + FR.num(km) + ' von ' + FR.num(goal) + ' km' : FR.num(km, km < 100 ? 1 : 0) + ' von ' + FR.num(goal) + ' km (' + Math.round(pct) + ' %)';
    $('goalBar').style.width = pct.toFixed(1) + '%';
    $('goalBarBox').setAttribute('aria-label', Math.round(pct) + ' Prozent des Monatsziels');
  }
  // bars
  const vals = P.buckets.map(b => inP.reduce((s, r) => { const d = FR.date(r.start); return d >= b.a && d < b.b ? s + (r.distance || 0) / 1000 : s; }, 0));
  const max = Math.max(...vals, 0.001);
  if (sel < 0 || sel >= vals.length) {
    // the current day / week / month, otherwise the last bar with a ride
    sel = P.buckets.findIndex(b => now >= b.a && now < b.b);
    if (sel < 0) { sel = vals.length - 1; for (let i = vals.length - 1; i >= 0; i--) if (vals[i] > 0) { sel = i; break; } }
  }
  $('barTitle').textContent = P.barTitle;
  $('barSel').textContent = P.buckets[sel].full + ' · ' + FR.num(vals[sel], range === 'year' ? 0 : 1) + ' km';
  $('bars').innerHTML = vals.map((v, i) => {
    const future = P.buckets[i].a > now;
    const hpx = v > 0 ? Math.max(6, Math.round(v / max * 84)) : future ? 0 : 3;
    const col = v > 0 ? (i === sel ? '#ff7a1a' : '#a0541e') : '#2a3542';
    return '<button data-i="' + i + '" aria-label="' + FR.esc(P.buckets[i].full) + ': ' + FR.num(v, 1) + ' km"><span style="height:' + hpx + 'px;background:' + col + '"></span></button>';
  }).join('');
  $('blabels').innerHTML = P.buckets.map((b, i) => '<span class="' + (i === sel ? 'on' : '') + '">' + FR.esc(b.label) + '</span>').join('');
}

// ------------------------------------------------------------------ list of rides and best times
function rideTime(r) { const t = FR.routeTime(r); return t != null ? t : r.duration; }
function renderRides() {
  const list = rides.slice(0, shown);
  $('rideCount').textContent = rides.length === 1 ? '1 Fahrt' : rides.length + ' Fahrten';
  $('rides').innerHTML = list.map(r => {
    const d = FR.date(r.start);
    const meta = FR.when(d) + ' · ' + FR.km(r.distance) + ' km · ' + FR.num(r.ascent || 0) + ' Hm';
    const badge = bestIds.has(r.id) ? '<span class="badge">Bestzeit</span>' : r.route && !r.route.finished ? '<span class="muted" style="font-size:12px">nicht ganz</span>' : '';
    return '<button class="ride" data-id="' + FR.esc(r.id) + '"><span class="ic">' + (r.route ? ROUTE_ICON : BIKE_ICON) + '</span>' +
      '<span class="l"><span class="n">' + FR.esc(FR.title(r)) + '</span><span class="m">' + meta + '</span></span>' +
      '<span class="r"><span class="t cond">' + FR.time(rideTime(r)) + '</span>' + badge + '</span></button>';
  }).join('') || '<div class="msg" style="padding:24px 16px">Noch keine Fahrt gespeichert. Nach deiner nächsten Fahrt steht sie hier.</div>';
  $('more').classList.toggle('hidden', rides.length <= shown);

  // best time per route
  const bests = [...bestByRoute.values()].sort((a, b) => (a.start < b.start ? 1 : -1));
  $('bestCard').classList.toggle('hidden', !bests.length);
  $('bests').innerHTML = bests.map(r => '<button class="ride" data-id="' + FR.esc(r.id) + '" style="min-height:54px"><span style="width:26px;flex:none">' + GHOST_ICON + '</span>' +
    '<span class="l"><span class="n" style="font-size:15px;font-weight:600">' + FR.esc(r.route.name) + '</span><span class="m">' + FR.when(FR.date(r.start)) + ' · ' + FR.km(r.route.length) + ' km</span></span>' +
    '<span class="r"><span class="t cond" style="font-size:20px">' + FR.time(FR.routeTime(r)) + '</span></span></button>').join('');
}

function computeBests() {
  bestByRoute.clear(); bestIds.clear();
  for (const r of rides) {
    const t = FR.routeTime(r);
    if (t == null) continue;
    const b = bestByRoute.get(r.route.key);
    if (!b || t < FR.routeTime(b)) bestByRoute.set(r.route.key, r);
  }
  for (const r of bestByRoute.values()) bestIds.add(r.id);
}

// ------------------------------------------------------------------ input
$('ranges').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  range = b.dataset.r; offset = 0; sel = -1;
  document.querySelectorAll('#ranges button').forEach(x => x.classList.toggle('on', x === b));
  renderPeriod();
});
$('prev').addEventListener('click', () => { offset--; sel = -1; renderPeriod(); });
$('next').addEventListener('click', () => { if (offset < 0) { offset++; sel = -1; renderPeriod(); } });
$('bars').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { sel = +b.dataset.i; renderPeriod(); } });
$('more').addEventListener('click', () => { shown += 20; renderRides(); });
document.addEventListener('click', e => {
  const r = e.target.closest('.ride');
  if (r && r.dataset.id) FR.go('ende.htm', 'id=' + encodeURIComponent(r.dataset.id) + '&from=history');
});

async function load() {
  try {
    const [rd, st] = await Promise.all([FR.rides(), FR.getSettings(['funrun_month_goal'])]);
    rides = rd; goal = Math.max(0, +st.funrun_month_goal || 0);
  } catch (e) { $('msg').textContent = e.message; return; }
  rides.sort((a, b) => (a.start < b.start ? 1 : -1));
  computeBests();
  renderPeriod();
  renderRides();
  $('msg').classList.add('hidden');
  $('content').classList.remove('hidden');
}
FR.onRefresh(load);
load();
})();
</script>
</body>
</html>
