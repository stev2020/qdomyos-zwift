# Temporary check: how DotWatcher answers a non-browser client (as the app's downloads are). Branch is deleted afterwards.
name: diag dotwatcher
on:
  push:
    branches: [ diag-dotwatcher ]
    paths: [ 'diag.py', 'probe.cjs', '.github/workflows/diag-dotwatcher.yml' ]
jobs:
  probe:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: node probe.cjs 2>&1 | tee out.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add out.txt
          git commit -m "diag output"
          git push
